name: terraform
on:
  push:
    branches: [main]
permissions:
  id-token: write   # lets the job request a GitHub OIDC token
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: learn-terraform-azure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Debug environment
        run: |
          echo "ARM_CLIENT_ID set: ${ARM_CLIENT_ID:+yes}"
          echo "ARM_TENANT_ID set: ${ARM_TENANT_ID:+yes}"
          echo "ARM_SUBSCRIPTION_ID set: ${ARM_SUBSCRIPTION_ID:+yes}"
          echo "ARM_USE_OIDC: $ARM_USE_OIDC"
      - run: terraform init
      - run: terraform plan
